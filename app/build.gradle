plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falcon.snap'
    compileSdk 34

    defaultConfig {
        applicationId "com.falcon.snap"
        // ONNX Runtime's Java API uses java.util.Optional (API 24), and a device that can hold the
        // ~1 GB NLLB model in memory is far newer than that anyway.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        // The bundled OCR models (src/main/assets/*.onnx) are already dense binary data: zipping them
        // only slows down loading, and leaving them stored lets the app read their size.
        noCompress 'onnx'
    }
}

dependencies {
    // This is a Java-only project, so nothing aligns the transitive Kotlin stdlib artifacts.
    // Without the BOM, kotlin-stdlib 1.8+ clashes with older kotlin-stdlib-jdk7/jdk8 ("Duplicate class").
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Reading a user-picked folder when importing model files
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Camera
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Runs both models fully offline: PaddleOCR PP-OCRv5 (OCR) and NLLB-200 (translation).
    // The model files are NOT in the APK; they are loaded from storage, see MODELS.md.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
